# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

ru:
  activerecord:
    models:
      user_request: "Заявка на лист ожидания"
    attributes:
      user_request:
        name: "Имя"
        email: "E-mail"
    errors:
      format: "%{attribute} — %{message}"
      messages:
        blank: "это поле необходимо заполнить"
        invalid: "некорректное значение"
        too_long: "слишком длинное значение (максимум %{count} символов)"
    activemodel:
      errors:
        models:
          user_request:
            attributes:
              email:
                invalid: "некорректный формат e-mail"

  errors:
    messages:
      blank: "Это поле необходимо заполнить"
      invalid: "Неверное значение"
      taken: "Уже используется"
      too_long: "Слишком длинное значение (максимум %{count} символов)"
      too_short: "Слишком короткое значение (минимум %{count} символов)"
      wrong_length: "Неверная длина (необходимо %{count} символов)"
      not_a_number: "Не является числом"
      not_an_email: "Неверный формат email адреса"
      not_a_date: "Неверный формат даты"
      invalid_date: "Некорректные данные"
      inclusion: "Значение недопустимо"
      less_than_or_equal_to: "Значение должно быть меньше или равно %{count}"
