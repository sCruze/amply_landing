variables:
  GIT_STRATEGY: fetch
  GIT_DEPTH: "0"

stages:
  - version
  - test
  - production

# ---------- VERSION ----------
compute_version:
  stage: version
  image: alpine/git:latest
  tags: [version]
  script: |
    set -euo pipefail
    git config --global --add safe.directory "$CI_PROJECT_DIR"
    git fetch --tags --force --prune

    BRANCH_SLUG="$(echo "${CI_COMMIT_REF_NAME}" | tr '/_' '-' | tr '[:upper:]' '[:lower:]')"

    if git describe --tags --exact-match --match 'v[0-9]*' >/dev/null 2>&1 ; then
      TAG="$(git describe --tags --exact-match --match 'v[0-9]*')"
      VER="${TAG#v}"
    else
      LAST_TAG="$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)"
      BASE="${BASE_VERSION:-${LAST_TAG#v}}"
      COUNT="$(git rev-list "${LAST_TAG}"..HEAD --count || echo 0)"
      if [ -n "${APP_PRERELEASE:-}" ]; then
        VER="${BASE}-${APP_PRERELEASE}+build.${COUNT}.${CI_COMMIT_SHORT_SHA}"
      else
        VER="${BASE}-dev.${BRANCH_SLUG}+build.${COUNT}.${CI_COMMIT_SHORT_SHA}"
      fi
    fi

    echo "APP_VERSION=${VER}" > version.env
    echo "Computed APP_VERSION=${VER}"
  artifacts:
    reports:
      dotenv: version.env

# ---------- RC TAG (manual on branch test) ----------
release_rc:
  stage: version
  image: alpine:3.19
  tags: [version]
  rules:
    - if: '$CI_COMMIT_BRANCH == "test"'
      when: manual
    - when: never
  before_script:
    - apk add --no-cache git
    - git config --global user.email "ci@local"
    - git config --global user.name "CI"
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script: |
    set -euo pipefail
    git fetch --tags --force --prune

    LAST_STABLE="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"

    if [ -n "${BASE_VERSION:-}" ]; then
      BASE="$BASE_VERSION"
    else
      if [ -z "$LAST_STABLE" ]; then
        BASE="0.1.0"
      else
        V="${LAST_STABLE#v}"
        IFS=. read -r M m p <<< "$V"
        BASE="${M}.$((m+1)).0"
      fi
    fi

    LAST_RC="$(git tag -l "v${BASE}-rc*" --sort=-v:refname | head -n1)"
    if [ -z "$LAST_RC" ]; then
      NEXT="v${BASE}-rc1"
    else
      N="$(echo "$LAST_RC" | sed -E 's/^v[0-9]+\.[0-9]+\.[0-9]+-rc([0-9]+)$/\1/')"
      NEXT="v${BASE}-rc$((N+1))"
    fi

    echo "Tagging RC: $NEXT"
    git tag -a "$NEXT" -m "RC $NEXT" "$CI_COMMIT_SHA"
    git push origin "$NEXT"


echo "Tagging RC: $NEXT"
  git tag -a "$NEXT" -m "RC $NEXT" "$CI_COMMIT_SHA"
  git push origin "$NEXT"

# ---------- FINAL TAG (manual on main) ----------
release_prod:
  stage: version
  image: alpine:3.19
  tags: [version]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
  before_script:
    - apk add --no-cache git
    - git config --global user.email "ci@local"
    - git config --global user.name "CI"
    - git remote set-url origin "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
  script: |
    set -euo pipefail
    git fetch --tags --force --prune

    if [ -n "${BASE_VERSION:-}" ]; then
      TAG="v${BASE_VERSION}"
      echo "Tagging final release: $TAG"
      git tag -a "$TAG" -m "Release $TAG" "$CI_COMMIT_SHA"
      git push origin "$TAG"
      exit 0
    fi

    LAST_RC="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*-rc[0-9]*' --sort=-v:refname | head -n1)"
    [ -z "$LAST_RC" ] && { echo "No RC tags; set BASE_VERSION=X.Y.Z"; exit 1; }

    BASE="$(echo "$LAST_RC" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+)-rc[0-9]+$/\1/')"
    TAG="v${BASE}"
    echo "Promoting latest RC $LAST_RC to final release $TAG"
    git tag -a "$TAG" -m "Release $TAG" "$CI_COMMIT_SHA"
    git push origin "$TAG"

# ---------- TEST (compose profile: dev) ----------
test:
  stage: test
  needs: ["compute_version"]
  image: alpine:3.19
  tags: [test]
  before_script:
    - apk add --no-cache docker-cli docker-cli-compose rsync
  script: |
    set -euo pipefail
    echo "Using version $APP_VERSION"

    install -d -m 0775 /home/gitlab-runner/amply_test
    rsync -rplD --delete --omit-dir-times \
      --filter='protect /.env' \
      --filter='protect /public/uploads/***' \
      --filter='protect /public/downloads/scratch/***' \
      --filter='protect /storage/***' \
      --exclude='/.git/***' \
      "$CI_PROJECT_DIR/" /home/gitlab-runner/amply_test/ \
      || { code=$?; [ "$code" = 24 ] && echo "Ignore rsync code 24" || exit "$code"; }

    cd /home/gitlab-runner/amply_test
    : > .env
    {
      echo "APP_VERSION=$APP_VERSION"
      echo "RAILS_ENV=development"
      echo "URL=${URL_TEST:-http://localhost:3006}"
      echo "PGHOST=${PGHOST_TEST:-db_dev}"
      echo "PGUSER=${PGUSER_TEST:-postgres}"
      echo "PGPASSWORD=${POSTGRES_PASSWORD_TEST:-postgres}"
      echo "PGDATABASE=${PGDATABASE_TEST:-app_development}"
      echo "REDIS_URL=${REDIS_URL_TEST:-redis://redis_dev:6379/1}"
      # при необходимости раскомментируйте:
      # echo "RAILS_MASTER_KEY=${RAILS_MASTER_KEY_TEST:-}"
      # echo "SECRET_KEY_BASE=${SECRET_KEY_BASE_TEST:-}"
    } >> .env

    docker compose --profile dev build --build-arg APP_VERSION="$APP_VERSION"
    docker compose --profile dev up -d --force-recreate
    docker compose run --rm dev rails db:migrate
  rules:
    - if: '$CI_COMMIT_BRANCH == "test"'

# ---------- PRODUCTION (compose profile: prod) ----------
production:
  stage: production
  needs: ["compute_version"]
  image: alpine:3.19
  tags: [production]
  before_script:
    - apk add --no-cache docker-cli docker-cli-compose rsync
  script: |
    set -euo pipefail
    echo "Using version $APP_VERSION"

    install -d -m 0775 /home/gitlab-runner/amply
    rsync -rplD --delete-after --omit-dir-times \
      --filter='protect /.env' \
      --filter='protect /public/***' \
      --filter='protect /storage/***' \
      --exclude='/.git/***' \
      "$CI_PROJECT_DIR/" /home/gitlab-runner/amply/ \
      || { code=$?; [ "$code" = 24 ] && echo "Ignore rsync code 24" || exit "$code"; }

    cd /home/gitlab-runner/amply
    : > .env
    {
      echo "RAILS_ENV=production"
      echo "APP_VERSION=$APP_VERSION"
      echo "URL=${URL_PROD:-https://example.com}"
      echo "PGHOST=${PGHOST_PROD:-db}"
      echo "PGUSER=${PGUSER_PROD:-postgres}"
      echo "PGPASSWORD=${POSTGRES_PASSWORD_PROD:-change_me}"
      echo "PGDATABASE=${PGDATABASE_PROD:-app_production}"
      echo "REDIS_URL=${REDIS_URL_PROD:-redis://redis:6379/1}"
      echo "RAILS_MASTER_KEY=${RAILS_MASTER_KEY_PROD:-}"
      echo "SECRET_KEY_BASE=${SECRET_KEY_BASE_PROD:-}"
    } >> .env

    docker compose --profile prod build \
      --build-arg APP_VERSION="$APP_VERSION" \
      --build-arg SECRET_KEY_BASE="${SECRET_KEY_BASE_PROD:-}"

    docker compose --profile prod up -d --force-recreate
    docker compose run --rm prod rails db:migrate
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
