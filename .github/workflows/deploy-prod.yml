name: Deploy (prod)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: ver
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            short=$(git rev-parse --short=8 HEAD)
            echo "version=0.0.0+${short}" >> "$GITHUB_OUTPUT"
          fi

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY_PROD }}

      - name: Trust host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST_PROD }}" >> ~/.ssh/known_hosts

      - name: Upload project (rsync if available, else tar over SSH)
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST_PROD }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          REMOTE_DIR="~/amply_landing"
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p $REMOTE_DIR"
          if ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "command -v rsync >/dev/null 2>&1"; then
            rsync -az --delete -e "ssh -p $SSH_PORT" \
              --exclude '.git' \
              --exclude '.github' \
              --exclude 'tmp' \
              ./ "$SSH_USER@$SSH_HOST:$REMOTE_DIR/"
          else
            tar -czf - \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='tmp' \
              . | ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "tar -xzf - -C $REMOTE_DIR"
          fi

      - name: Write .env on server
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST_PROD }}" bash -lc '
            set -eo pipefail
            cd ~/amply_landing
            cat > .env <<EOF
              RAILS_ENV=production
              APP_HOST=${{ secrets.APP_DOMAIN_PROD }}
              APP_PROTOCOL=https
              APP_PORT=443
              
              # Postgres (compose network)
              PGHOST=db
              PGUSER=postgres
              PGPASSWORD=${{ secrets.PGPASSWORD_PROD }}
              PGDATABASE=amply_production
              
              # Redis
              REDIS_URL=redis://redis:6379/1
              
              # Rails secrets
              RAILS_MASTER_KEY=${{ secrets.RAILS_MASTER_KEY }}
              SECRET_KEY_BASE=${{ secrets.SECRET_KEY_BASE_PROD }}
              
              # Mailer (optional)
              MAIL_FROM=${{ secrets.MAIL_FROM }}
              MAIL_FALLBACK_TO=${{ secrets.MAIL_FALLBACK_TO }}
              SMTP_ADDRESS=${{ secrets.SMTP_ADDRESS }}
              SMTP_PORT=${{ secrets.SMTP_PORT }}
              SMTP_DOMAIN=${{ secrets.SMTP_DOMAIN }}
              SMTP_USER_NAME=${{ secrets.SMTP_USER_NAME }}
              SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
              SMTP_AUTHENTICATION=${{ secrets.SMTP_AUTHENTICATION }}
              SMTP_ENABLE_STARTTLS_AUTO=${{ secrets.SMTP_ENABLE_STARTTLS_AUTO }}
              SMTP_TLS=${{ secrets.SMTP_TLS }}
              WAITLIST_NOTIFY_RECIPIENTS=${{ secrets.WAITLIST_NOTIFY_RECIPIENTS }}
              
              # Build version
              APP_VERSION=${{ steps.ver.outputs.version }}
            EOF
          '

      - name: Build & Up (Docker Compose, prod)
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST_PROD }}" bash -lc '
            set -eo pipefail
            cd ~/amply_landing
            docker compose --profile prod build \
              --build-arg APP_VERSION="${{ steps.ver.outputs.version }}" \
              --build-arg RAILS_MASTER_KEY="${{ secrets.RAILS_MASTER_KEY }}" \
              --build-arg SECRET_KEY_BASE="${{ secrets.SECRET_KEY_BASE_PROD }}"
            docker compose --profile prod up -d --force-recreate
          '

      - name: DB prepare (create + migrate)
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST_PROD }}" bash -lc '
            set -eo pipefail
            cd ~/amply_landing
            docker compose run --rm prod rails db:prepare
          '

      - name: Cleanup old images (optional)
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST_PROD }}" "docker image prune -f"
